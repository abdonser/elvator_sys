<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin Login - Elevator</title><link rel="stylesheet" href="css/style.css"></head><body><div style="max-width:380px;margin:12vh auto;padding:0 16px"><section class="panel" style="padding:28px"><h1>Super Admin</h1><p>Sign in to the platform control panel.</p><form onsubmit="return signIn(event)"><div class="form-grid" style="grid-template-columns:1fr"><label>Email<input id="email" type="email" required></label><label>Password<input id="pw" type="password" required></label></div><p id="err" class="hint" style="color:#c0392b"></p><button class="gold-btn" type="submit">Sign in</button></form></section></div><script>
// DEMO ONLY: credentials are checked in the browser. Replace with real server-side auth before production.
const SUPER_ADMIN={email:'superadmin@elevator.com',password:'admin123'};
function signIn(e){e.preventDefault();if(email.value.trim().toLowerCase()===SUPER_ADMIN.email&&pw.value===SUPER_ADMIN.password){sessionStorage.setItem('super-admin','1');location.replace('index.html')}else err.textContent='Invalid credentials.';return false}
</script><script src="js/i18n.js"></script></body></html>
