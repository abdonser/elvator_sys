<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Account - Elevator</title><link rel="stylesheet" href="css/style.css"></head><body><div style="max-width:380px;margin:12vh auto;padding:0 16px"><section class="panel" style="padding:28px" id="actBody"><h1>Activate your account</h1><p>Enter your invite code and choose a password.</p><form onsubmit="activateAccount(event)"><div class="form-grid" style="grid-template-columns:1fr"><label>Invite code<input id="actCode" required placeholder="XXXX-XXXX"></label><label>New password<input id="actPw" type="password" required minlength="6"></label></div><p id="actErr" class="hint" style="color:#c0392b"></p><button class="gold-btn" type="submit">Activate</button></form></section></div><script src="js/admin.js"></script><script>const c=new URLSearchParams(location.search).get('code');if(c)document.getElementById('actCode').value=c</script><script src="js/i18n.js"></script></body></html>
