<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Requests - Elevator</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside class="sidebar"></aside><main><header><button class="menu" id="menu">☰</button><div><h1>Daily Requests</h1><p>Create, monitor and assign today's service requests.</p></div><button class="gold-btn header-btn" onclick="addDailyRequest()">+ New request</button></header><section class="panel"><div class="toolbar"><input id="dailySearch" placeholder="Search request, building or elevator" oninput="renderDailyRequests()"><select id="dailyStatus" onchange="renderDailyRequests()"><option value="">All statuses</option><option>Open</option><option>Assigned</option><option>In progress</option><option>Completed</option></select><select id="dailyPriority" onchange="renderDailyRequests()"><option value="">All priorities</option><option>Emergency</option><option>High</option><option>Normal</option></select><select id="companyFilter" onchange="renderDailyRequests()"></select></div><div class="table-wrap"><table><thead><tr><th>Request</th><th>Company</th><th>Building / Elevator</th><th>Zone</th><th>Issue</th><th>Priority</th><th>Technician</th><th>Status</th><th>Action</th></tr></thead><tbody id="dailyRequests"></tbody></table></div></section></main></div><script src="js/layout.js"></script><script src="js/admin.js"></script><script>renderDailyRequests()</script></body></html>
